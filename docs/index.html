<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>Cubopolis</title>
<link rel="stylesheet" href="game.css">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cubopolis">
<meta name="theme-color" content="#9fd3f0">
<link rel="apple-touch-startup-image" href="launch-landscape.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
</head>
<body>
<canvas id="world"></canvas>
<div id="ui"></div>
<div id="rotate" role="status">
<svg viewBox="0 0 96 96" aria-hidden="true"><rect x="34" y="14" width="28" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="5"/><path d="M22 78h52" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M70 30c10 6 14 16 12 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M88 50l-6 10-9-7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>Turn your phone sideways</b>
<span>Cubopolis plays in landscape. If the screen will not turn, open Control Centre (swipe down from the top-right corner) and switch off the rotation lock.</span>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', function () {
  var had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (had) dispatchEvent(new Event('cubopolis-update'));
    had = true;
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reg.update().catch(function () {});
    });
  }).catch(function () {});
});
</script>
</body>
</html>
